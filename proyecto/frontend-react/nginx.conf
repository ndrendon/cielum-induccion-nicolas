# Configuración de nginx para el frontend dentro de Docker
server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Las peticiones a /api/... se pasan al servicio api de Docker Compose, sin el /api.
  # Por ejemplo, /api/pedidos llega a la API como /pedidos.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Cualquier otra ruta devuelve index.html, para que React Router se encargue
  # de la URL (por ejemplo /pedidos/13) aunque se recargue la página.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
