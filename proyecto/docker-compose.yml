# Proyecto integrador en Docker.
# Partes 3 y 4: la API y el frontend en React. Parte 5: el frontend en Vue.
# Parte 7: n8n, que recibe cada pedido nuevo y lo pasa a Zoho CRM, y Mailpit para ver sus correos.
#
# postgres, n8n y mailpit los usan los dos modos del proyecto, así que todo queda en un solo lugar:
#   Modo local:  docker compose up -d postgres mailpit n8n   (la API y la página van con npm run dev)
#   Modo Docker: docker compose up -d --build                (también la API y las páginas)
#
# Antes hay que crear el archivo .env a partir de .env.example (ver README.md).
#
# Servicios y puertos en el computador:
#   postgres      localhost:5433          (PostgreSQL con la base proyecto, de los dos modos)
#   n8n           http://localhost:5678   (n8n: los workflows de la parte 7, de los dos modos)
#   mailpit       http://localhost:8025   (los correos que manda n8n, de los dos modos)
#   api           http://localhost:3001   (la API en Docker, la del entorno docker de Postman)
#   frontend      http://localhost:8080   (la página en React en Docker)
#   frontend-vue  http://localhost:8082   (la misma página hecha en Vue)
#   sqlserver     localhost:1434          (SQL Server 2022)
#   adminer       http://localhost:8081   (página para ver la base de PostgreSQL)

name: proyecto

services:
  postgres:
    image: postgres:16
    container_name: proyecto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo proyecto/.env}
      # Base que se crea sola la primera vez
      POSTGRES_DB: proyecto
    ports:
      # 5433 en el computador, porque el 5432 ya lo usa pg-induccion
      - "5433:5432"
    volumes:
      # Volumen: los datos de la base quedan guardados aunque se borre el contenedor
      - datos-postgres:/var/lib/postgresql/data
      # Scripts de inicialización: PostgreSQL los ejecuta en orden (01, 02) solo la primera
      # vez, cuando el volumen está vacío. Crean las tablas y cargan los datos de ejemplo.
      - ./api/db/01_modelo.sql:/docker-entrypoint-initdb.d/01_modelo.sql:ro
      - ./api/db/02_datos.sql:/docker-entrypoint-initdb.d/02_datos.sql:ro
      # Parte 7: la tabla log_integraciones, donde n8n registra lo que hizo con cada pedido.
      # Si el volumen ya tenía datos, este archivo no se ejecuta solo (ver n8n/README.md)
      - ./api/db/03_integraciones.sql:/docker-entrypoint-initdb.d/03_integraciones.sql:ro
    healthcheck:
      # pg_isready revisa si PostgreSQL ya acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Se construye con proyecto/api/Dockerfile
    build: ./api
    image: proyecto-api
    container_name: proyecto-api
    environment:
      PORT: "3000"
      # Dentro de la red de Compose, la base se encuentra por el nombre del servicio
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: proyecto
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo proyecto/.env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo proyecto/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Las consultas usan la hora de Colombia: los pedidos nuevos quedan con la fecha de aquí
      PGOPTIONS: "-c timezone=America/Bogota"
      # Parte 7: la API le avisa a n8n cada vez que se crea un pedido.
      # Dentro de la red de Compose, n8n se encuentra por el nombre del servicio
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/pedido-creado
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Falta N8N_WEBHOOK_SECRET en el archivo proyecto/.env}
    ports:
      - "3001:3000"
    healthcheck:
      # Llama a /salud dentro del contenedor; si responde bien, la API queda "healthy"
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/salud').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      # La API no arranca hasta que el healthcheck de PostgreSQL salga bien
      postgres:
        condition: service_healthy

  frontend:
    # Se construye con proyecto/frontend-react/Dockerfile: Node arma la página y nginx la sirve
    build: ./frontend-react
    image: proyecto-frontend
    container_name: proyecto-frontend
    ports:
      # nginx escucha en el puerto 80 del contenedor; en el computador queda en el 8080
      - "8080:80"
    depends_on:
      # nginx le pasa las peticiones de /api al servicio api, así que la API debe estar lista primero
      api:
        condition: service_healthy
        # Si la API se vuelve a crear (por ejemplo con --build), el frontend también se reinicia,
        # para que nginx encuentre el contenedor nuevo de la API
        restart: true

  frontend-vue:
    # Se construye con proyecto/frontend-vue/Dockerfile, igual que el de React:
    # Node arma la página y nginx la sirve
    build: ./frontend-vue
    image: proyecto-frontend-vue
    container_name: proyecto-frontend-vue
    ports:
      # En el computador queda en el 8082, porque el 8081 ya lo usa adminer
      - "8082:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: proyecto-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD en el archivo proyecto/.env}
    ports:
      # 1434 en el computador, porque el 1433 ya lo usa el SQL Server del día 05
      - "1434:1433"
    volumes:
      - datos-sqlserver:/var/opt/mssql
    healthcheck:
      # sqlcmd se conecta y ejecuta SELECT 1; -C acepta el certificado del servidor
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n:
    # Parte 7: n8n recibe en un webhook el aviso de cada pedido nuevo y pasa el cliente a Zoho CRM.
    # Es el mismo para los dos modos: la API local le avisa en localhost:5678 y la de Docker en n8n:5678.
    # Los workflows están en proyecto/n8n y se importan desde la página de n8n.
    image: n8nio/n8n:2.44.5
    container_name: proyecto-n8n
    environment:
      # Zona horaria de los horarios (Schedule Trigger) y de las fechas que muestra n8n
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      # Llave con la que n8n cifra las credenciales que se guardan (Zoho, PostgreSQL, SMTP)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en el archivo proyecto/.env}
      # El archivo de configuración de n8n solo lo puede leer su dueño
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # No mandar datos de uso a n8n
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "5678:5678"
    volumes:
      # Volumen: los workflows, las credenciales cifradas y las ejecuciones quedan guardados
      - datos-n8n:/home/node/.n8n
      # Carpeta compartida: lo que n8n escribe en /home/node/.n8n-files aparece en proyecto/n8n/archivos.
      # Es la única carpeta donde n8n deja leer y escribir archivos.
      - ./n8n/archivos:/home/node/.n8n-files
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    # Servidor de correo de pruebas: recibe los correos que manda n8n y los muestra en una página.
    # No los envía a internet, así que no se necesita una cuenta de correo real.
    image: axllent/mailpit:v1.31
    container_name: proyecto-mailpit
    environment:
      # Acepta cualquier usuario y contraseña de SMTP, también sin cifrar: es solo para pruebas
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      # La página para ver los correos. El SMTP (puerto 1025) solo se usa dentro de la red de Compose
      - "8025:8025"

  adminer:
    image: adminer
    container_name: proyecto-adminer
    environment:
      # Servidor que aparece escrito en la pantalla de inicio de Adminer
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos-postgres:
  datos-sqlserver:
  datos-n8n:
